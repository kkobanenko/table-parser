version: '3.8'

services:
  table-parser:
    build: .
    container_name: medical-table-parser
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app
      - ./temp:/app/temp
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped